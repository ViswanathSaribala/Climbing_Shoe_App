<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisor Notes Admin</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Private Editor</p>
          <h1>Shoe Database Manager</h1>
          <p>Add shoes and update both official product data and private advisor insights in Supabase.</p>
        </div>
        <a class="text-link" href="/">Advisor app</a>
      </header>

      <section class="admin-login" id="login-panel">
        <label>
          Admin token
          <input id="admin-token" type="password" autocomplete="current-password" placeholder="Paste your ADMIN_TOKEN" />
        </label>
        <button id="load-shoes" type="button">Load Shoes</button>
      </section>

      <section class="admin-workspace" id="admin-workspace" hidden>
        <aside class="shoe-sidebar">
          <button id="add-shoe" type="button" class="wide-action">Add Shoe</button>
          <label>
            Search
            <input id="shoe-search" type="search" placeholder="Brand or model" />
          </label>
          <div id="shoe-list" class="shoe-list"></div>
        </aside>

        <section class="editor-panel">
          <div id="editor-empty" class="results-empty">Select a shoe to edit it, or add a new shoe.</div>
          <form id="shoe-editor" hidden>
            <div class="editor-title">
              <div>
                <p class="eyebrow" id="editor-mode-label">Selected Shoe</p>
                <h2 id="editor-heading"></h2>
              </div>
              <button type="submit" id="save-shoe">Save Shoe</button>
            </div>

            <section class="official-card">
              <h3>Official Data</h3>
              <dl id="official-data" class="official-grid"></dl>
            </section>

            <section class="official-card" id="official-editor">
              <h3>Official Product Data</h3>
              <div class="control-grid">
                <label>
                  Brand
                  <input name="brand" type="text" placeholder="Scarpa" />
                </label>
                <label>
                  Model
                  <input name="model" type="text" placeholder="Instinct VSR" />
                </label>
                <label>
                  Gender fit
                  <input name="gender_fit" type="text" placeholder="Unisex, Men/Women, LV" />
                </label>
                <label>
                  Closure
                  <input name="closure" type="text" placeholder="Lace, Slipper, Hook-and-loop" />
                </label>
                <label>
                  Rubber
                  <input name="rubber_primary" type="text" placeholder="Vibram XS Grip2" />
                </label>
                <label>
                  Shoe material
                  <select name="material_category">
                    <option value="unknown">Unknown</option>
                    <option value="leather">Leather</option>
                    <option value="synthetic_leather">Synthetic leather</option>
                    <option value="vegan_materials">Vegan materials</option>
                    <option value="mixed">Mixed materials</option>
                    <option value="other">Other</option>
                  </select>
                </label>
                <label>
                  Vegan verification
                  <select name="vegan">
                    <option value="unknown">Unknown</option>
                    <option value="yes">Verified vegan</option>
                    <option value="no">Not vegan</option>
                  </select>
                </label>
                <label>
                  Lining
                  <select name="lined">
                    <option value="unknown">Unknown</option>
                    <option value="yes">Lined</option>
                    <option value="no">Unlined</option>
                  </select>
                </label>
                <label>
                  Rubber thickness mm
                  <input name="rubber_thickness_mm" type="number" step="0.1" />
                </label>
                <label>
                  Profile
                  <input name="profile" type="text" placeholder="Flat, moderate, aggressive" />
                </label>
                <label>
                  Asymmetry
                  <input name="asymmetry" type="text" placeholder="Low, medium, high" />
                </label>
                <label>
                  Stiffness 1-5
                  <input name="stiffness" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Sensitivity 1-5
                  <input name="sensitivity" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Support 1-5
                  <input name="support" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Official confidence
                  <select name="official_confidence">
                    <option value="unknown">Unknown</option>
                    <option value="official">Official</option>
                    <option value="researched">Researched</option>
                    <option value="estimated">Estimated</option>
                  </select>
                </label>
                <label>
                  Bouldering 1-5
                  <input name="bouldering" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Sport 1-5
                  <input name="sport" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Indoor 1-5
                  <input name="indoor" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Outdoor 1-5
                  <input name="outdoor" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Trad 1-5
                  <input name="trad" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Multipitch 1-5
                  <input name="multipitch" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Beginner 1-5
                  <input name="beginner" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Intermediate 1-5
                  <input name="intermediate" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Advanced 1-5
                  <input name="advanced" type="number" min="0" max="5" step="1" />
                </label>
                <label>
                  Product URL
                  <input name="product_url" type="url" placeholder="https://..." />
                </label>
              </div>

              <label class="full-field">
                Official notes
                <textarea name="official_notes" rows="4" placeholder="Summarize official product description or specs..."></textarea>
              </label>
            </section>

            <section class="official-card">
              <h3>Advisor Insights</h3>
              <div class="control-grid">
                <label>
                  Foot width
                  <select name="foot_width">
                    <option value="unknown">Unknown</option>
                    <option value="narrow">Narrow</option>
                    <option value="medium">Medium</option>
                    <option value="medium-wide">Medium-wide</option>
                    <option value="wide">Wide</option>
                  </select>
                </label>
                <label>
                  Foot volume
                  <select name="foot_volume">
                    <option value="unknown">Unknown</option>
                    <option value="low">Low</option>
                    <option value="low-medium">Low-medium</option>
                    <option value="medium">Medium</option>
                    <option value="medium-high">Medium-high</option>
                    <option value="high">High</option>
                  </select>
                </label>
                <label>
                  Heel fit
                  <input name="heel_fit" type="text" placeholder="e.g. secure, roomy, narrow heel cup" />
                </label>
                <label>
                  Fit confidence
                  <select name="fit_confidence">
                    <option value="unknown">Unknown</option>
                    <option value="estimated">Estimated</option>
                    <option value="researched">Researched</option>
                    <option value="tested">Tested</option>
                  </select>
                </label>
                <label>
                  Comfort offset EU
                  <input name="comfort" type="number" step="0.5" placeholder="-0.5" />
                </label>
                <label>
                  Performance offset EU
                  <input name="performance" type="number" step="0.5" placeholder="-1" />
                </label>
                <label>
                  Aggressive offset EU
                  <input name="aggressive" type="number" step="0.5" placeholder="-1.5" />
                </label>
                <label>
                  Source type
                  <select name="source_type">
                    <option value="unknown">Unknown</option>
                    <option value="estimated">Estimated</option>
                    <option value="researched">Researched</option>
                    <option value="tested">Tested</option>
                    <option value="shop_fit">Shop fit</option>
                    <option value="user_feedback">User feedback</option>
                  </select>
                </label>
              </div>

              <fieldset class="checkbox-group">
                <legend>Toe shape fit</legend>
                <label><input type="checkbox" name="toe_shape_fit" value="egyptian" /> Egyptian</label>
                <label><input type="checkbox" name="toe_shape_fit" value="greek" /> Greek</label>
                <label><input type="checkbox" name="toe_shape_fit" value="roman-square" /> Roman / square</label>
                <label><input type="checkbox" name="toe_shape_fit" value="unknown" /> Unknown</label>
              </fieldset>

              <label class="full-field">
                Summary
                <textarea name="summary" rows="5" placeholder="Write the practical advisor note for this shoe..."></textarea>
              </label>

              <label class="validation-check">
                <input name="needs_validation" type="checkbox" />
                Needs validation
              </label>
            </section>
          </form>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="src/admin.js"></script>
  </body>
</html>
